{% set name = "notebook" %}
{% set version = "7.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3b27eaf9913033c28dde92d02139414c608992e1df4b969c843219acf2ff95e4

build:
  number: 0
  skip: true  # [py<39]
  entry_points:
    - jupyter-notebook = notebook.app:main
  no_link:
    - Menu/{{ name }}_menu.json

requirements:
  host:
    - python
    - pip
    - hatchling >=1.11
    - hatch-jupyter-builder >=0.5
    - jupyterlab >=4.5.0rc0,<4.6
    - httpx >=0.25.0,<1.0.0
  run:
    - python
    - jupyter_server >=2.4.0,<3
    - jupyterlab >=4.5.0rc0,<4.6
    - jupyterlab_server >=2.27.1,<3
    - notebook-shim <0.3,>=0.2
    - tornado >=6.2.0
    - jupyter-server <3,>=2.4.0
    - jupyterlab-server <3,>=2.28.0
  run_constrained:
    - jupyter_server >=2.4.0,<3
    - jupyterlab_server >=2.28.0,<3
    - notebook-shim >=0.2,<0.3

app:
  entry: jupyter-notebook  # [not osx]
  entry: open ${PREFIX}/bin/jupyter_mac.command  # [osx]
  icon: jupyter.png
  summary: Jupyter Notebook
  type: web
  cli_opts:
    - name: port
      args: "--port %s"
      default: 8080
      summary: Server port ...

test:
  imports:
    - notebook
  requires:
    - pip
    - ripgrep
  commands:
    - pip check
    - jupyter notebook -h
    - jupyter-notebook -h
    - jupyter labextension list
    - jupyter labextension list 1>labextensions 2>&1
    - cat labextensions | rg "@jupyter-notebook/lab-extension.*OK"  # [not win]
    - type labextensions | rg "@jupyter-notebook/lab-extension.*ok"  # [win]

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - notebook/labextension/static/third-party-licenses.json
    - notebook/static/third-party-licenses.json
  summary: A web-based notebook environment for interactive computing
  description: |
    The Jupyter notebook is a web-based notebook environment for interactive computing.
  dev_url: https://github.com/jupyter/notebook
  doc_url: https://jupyter-notebook.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - gnestor
    - takluyver
    - lresende
    - bollwyvl
